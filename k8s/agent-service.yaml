apiVersion: v1
kind: Service
metadata:
  name: agent-service
  namespace: finance-agent
spec:
  # Para Docker Desktop: usar NodePort
  # Para GKE: usar LoadBalancer
  type: NodePort
  selector:
    app: finance-agent
  ports:
  - port: 8000
    targetPort: 8000
    # Para Docker Desktop: puerto fijo para acceder via localhost:30080
    nodePort: 30080
    protocol: TCP
    name: http
